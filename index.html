<body>

        <div>Este es un contenedor genérico (div).</div>

        <dl>
        <dt>Término 1</dt>
        <dd>Definición del término 1.</dd>
        <dt>Término 2</dt>
        <dd>Definición del término 2.</dd>
        </dl>
        <figure>
            <img src="imagen.jpg" alt="Descripción de la imagen en el repositorio">
            <figcaption>Esta es la leyenda (figcaption) de la imagen.</figcaption>
        </figure>
    </section>
    <section></section>
    <section></section>
    <section></section>
    <section></section>
